[project]
name = "my-neet-tutor"
version = "0.1.0"
description = "NCERT question-answering tutor using retrieval-augmented generation"
readme = "README.md"
authors = [
    { name = "areejanzari", email = "areejanzari512@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.150.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "unstructured[local-inference]>=0.27.27",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
my-neet-tutor = "my_neet_tutor:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
